      if (p.t === 'fire') LIGHTS.push({ x: p.x, y: p.y - 30, r: 78, a: 0.95, warm: true });
      if (p.t === 'lamp') LIGHTS.push({ x: p.x, y: p.y - 60, r: 46, a: 0.9, warm: true });
      if (p.t === 'altar') LIGHTS.push({ x: p.x, y: p.y - 50, r: 44, a: 0.85, warm: true });
    });
    SCONCES.forEach(s => LIGHTS.push({ x: s[0], y: s[1] - 20, r: 34, a: 0.8, warm: true }));
    LIGHTS.push({ x: 1200, y: 1140, r: 90, a: 0.55, warm: true });
    LIGHTS.push({ x: 575, y: 1250, r: 70, a: 0.5, warm: false });

    let staticCv = null;
    function buildStatic() {
      const art = mk(AW, AH);
      const g = art.getContext('2d');
      R(g, '#06080c', 0, 0, AW, AH);
      const rnd = rng(7);
      paintFloor(g, { x:250, y:250, w:1900, h:1300, floorColor:'#4d3447' });
      rooms.forEach(rm => { paintFloor(g, rm); });
      paintRug(g, Math.round(575 / PX), Math.round(590 / PX), 30, 17, '#7a2e3a', '#5a1f2a');
      paintRug(g, Math.round(1825 / PX), Math.round(620 / PX), 40, 22, '#2f4f7a', '#243b5c');
      paintRunner(g, Math.round(1200 / PX) - 18, Math.round(1030 / PX), 36, 100, '#6a2b35');
      paintRunner(g, Math.round(1175 / PX) - 18, Math.round(420 / PX), 36, 140, '#4a2b45');
      paintRunner(g, Math.round(1825 / PX) - 9, Math.round(1090 / PX), 18, 90, '#5a2a3a');
      rooms.forEach(rm => {
        paintBackWall(g, rm, rnd);
        const x0 = Math.round(rm.x / PX), y0 = Math.round(rm.y / PX) + Math.round(110 / PX), w = Math.round(rm.w / PX);
        R(g, 'rgba(0,0,0,0.38)', x0, y0, w, 1); R(g, 'rgba(0,0,0,0.26)', x0, y0 + 1, w, 1);
        R(g, 'rgba(0,0,0,0.16)', x0, y0 + 2, w, 1); R(g, 'rgba(0,0,0,0.08)', x0, y0 + 3, w, 2);
      });
      paintWalls(g);
      const place = (c, wx, wy) => g.drawImage(c, Math.round(wx / PX - c.width / 2), Math.round(wy / PX - c.height));
      WINDOWS.forEach(w => place(sprWindow(w[2]), w[0], w[1]));
      PAINTINGS.forEach(p => place(sprPainting(p[2]), p[0], p[1]));
      SCONCES.forEach(s => place(sprSconce(), s[0], s[1]));
      place(sprTrophy(), 1060, 962);
      staticCv = mk(AW * PX, AH * PX, c => {
        c.imageSmoothingEnabled = false;
        c.drawImage(art, 0, 0, AW, AH, 0, 0, AW * PX, AH * PX);
        c.font = '600 13px "DM Mono",monospace';
        c.textAlign = 'left';
        rooms.forEach(rm => {
          c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillText(rm.name, rm.x + 21, rm.y + 137);
          c.fillStyle = '#e8d9b0'; c.fillText(rm.name, rm.x + 20, rm.y + 136);
        });
      });
    }

    const lightCv = mk(AW, AH), lg = lightCv.getContext('2d');
    let flash = 0, nextFlash = 3000;
    const labelQueue = [];

    function blit(c, x, y) {
      const sx = Math.round((x - (c.width * PX) / 2) / PX) * PX;
      const sy = Math.round((y - c.height * PX) / PX) * PX;
      ctx.drawImage(c, 0, 0, c.width, c.height, sx, sy, c.width * PX, c.height * PX);
    }
    function softShadow(x, y, w) {
      ctx.fillStyle = 'rgba(0,0,0,0.30)';
      ctx.fillRect(Math.round((x - w / 2) / PX) * PX, Math.round((y - PX) / PX) * PX, w, PX * 2);
    }

    function drawProp(p, t) {
      let c;
      switch (p.t) {
        case 'fire': c = sprFireplace(Math.floor(t / 130) % 3); break;
        case 'shelf': c = sprBookshelf(p.a || 1); break;
        case 'desk': c = sprDesk(); break;
        case 'armchair': c = sprArmchair(p.c || '#6a2b4a'); break;
        case 'sofa': c = sprSofa(p.c || '#2e5a52'); break;
        case 'piano': c = sprPiano(); break;
        case 'lamp': c = sprLamp(); break;
        case 'plant': c = sprPlant(p.a || 1); break;
        case 'barrel': c = sprBarrel(); break;
        case 'crate': c = sprCrate(); break;
        case 'clock': c = sprClock(); break;
        case 'armor': c = sprArmor(); break;
        case 'pew': c = sprPew(); break;
        case 'altar': c = sprAltar(); break;
        case 'grave': c = sprGrave(p.a || 1); break;
        case 'fountain': c = sprFountain(Math.floor(t / 400) % 2); break;
        case 'table': c = sprTable(); break;
        case 'bush': c = sprBush(p.a || 1); break;
        case 'chair': c = sprChair(); break;
        case 'door': c = sprDoor(); break;
        default: return;
      }
      if (p.t !== 'fire' && p.t !== 'door') softShadow(p.x, p.y, c.width * PX - 2 * PX);
      blit(c, p.x, p.y);
      if (p.t === 'altar') {
        blit(sprFlame(Math.floor(t / 140) % 2), p.x - 25, p.y - 63);
        blit(sprFlame(Math.floor(t / 140 + 1) % 2), p.x + 25, p.y - 63);
      }
      if (p.t === 'clock') {
        const sx = Math.round((p.x - 18) / PX) * PX, sy = Math.round((p.y - 34 * PX) / PX) * PX;
        const A = (ax, ay, aw, ah, col) => { ctx.fillStyle = col; ctx.fillRect(sx + ax * PX, sy + ay * PX, aw * PX, ah * PX); };
        A(3, 4, 6, 6, '#e9e2cf');
        const mm = gameMinutes % 60, hh = (gameMinutes / 60) % 12;
        const ma = mm / 60 * Math.PI * 2, ha = hh / 12 * Math.PI * 2;
        A(6, 7, 1, 1, '#1a1216');
        A(6 + Math.round(Math.sin(ma) * 2.4), 7 - Math.round(Math.cos(ma) * 2.4), 1, 1, '#1a1216');
        A(6 + Math.round(Math.sin(ha) * 1.4), 7 - Math.round(Math.cos(ha) * 1.4), 1, 1, '#7a2430');
        A(3, 13, 6, 16, '#120a06');
        const sw = Math.sin(t / 600);
        A(Math.round(5.5 + sw * 0.9), 15, 1, 6, '#8a7650');
        A(Math.round(5 + sw * 1.8), 21, 2, 2, '#e8cf7a');
      }
    }

    function drawWindowRain(t) {
      const wx = weatherNow(); if (wx === 'clear') return;
      const sp = wx === 'storm' ? 70 : 150;
      ctx.fillStyle = 'rgba(190,212,238,0.6)';
      WINDOWS.forEach((w, i) => {
        if (w[2] === 'stained') return;
        const left = w[0] - 15, top = w[1] - 57;
        for (let k = 0; k < 4; k++) {
          const yy = ((t / sp) + k * 11 + i * 7) % 38;
          ctx.fillRect(Math.round((left + 3 + k * 8) / PX) * PX, Math.round((top + yy) / PX) * PX, PX, PX * 2);
        }
      });
    }

    function drawChar(p, t) {
      let dir = p.facing || 'down';
      if (p !== player) {
        if (p.walking) p._dir = Math.abs(p.vx) > Math.abs(p.vy) ? (p.vx < 0 ? 'left' : 'right') : (p.vy < 0 ? 'up' : 'down');
        dir = p._dir || 'down';
      }
      const phase = p === player ? 0 : (p.id.length + p.id.charCodeAt(0)) % 4;
      const fr = p.walking ? [0, 1, 0, 2][(Math.floor(t / 140) + phase) % 4] : 0;
      const spr = charSprite(p, dir, fr);

      const CHAR_SCALE = 1.25;
      const charPX = PX * CHAR_SCALE;

      const breath = !p.walking && Math.sin(t / 520 + phase * 1.9) > 0.35 ? Math.round(charPX / 2) : 0;
      const bob = (p.walking && fr !== 0 ? charPX : 0) + breath;
      const x = Math.round(p.x / PX) * PX, feet = Math.round((p.y + 33) / PX) * PX;
      
      ctx.fillStyle = 'rgba(0,0,0,0.34)';
      ctx.fillRect(x - 4 * charPX, feet - charPX, 8 * charPX, charPX);
      ctx.fillRect(x - 6 * charPX, feet, 12 * charPX, charPX);
      ctx.fillRect(x - 4 * charPX, feet + charPX, 8 * charPX, charPX);

      const drawW = spr.width * charPX;
      const drawH = spr.height * charPX;
      const sx = Math.round(x - drawW / 2);
      const sy = Math.round(feet - drawH + 10 - bob);

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(spr, 0, 0, spr.width, spr.height, sx, sy, drawW, drawH);

      const label = p.shortName || p.name || '';
      labelQueue.push(() => {
        ctx.font = '10px "DM Mono",monospace';
        ctx.textAlign = 'center';
        const tw = Math.ceil(ctx.measureText(label).width) + 14;
        const ly = sy - 18;
        ctx.fillStyle = 'rgba(14,18,26,0.88)';
        ctx.fillRect(Math.round(x - tw / 2), ly, tw, 16);
        ctx.strokeStyle = p === player ? '#f39c12' : '#7a8794';
        ctx.lineWidth = 1;
        ctx.strokeRect(Math.round(x - tw / 2) + 0.5, ly + 0.5, tw - 1, 15);
        ctx.fillStyle = '#f8f5eb';
        ctx.fillText(label, x, ly + 12);
      });
    }

    function drawClue(o, t) {
      const c = sprClue(o.type);
      const found = clues.some(k => k.id === o.id);
      const base = o.y + 18;
      softShadow(o.x, base, c.width * PX);
      blit(c, o.x, base);
      if (!found) {
        const top = base - c.height * PX - 10 - Math.round(Math.sin(t / 260) * 3);
        const big = Math.floor(t / 350) % 2 === 0;
        ctx.fillStyle = '#ffd45a';
        const cx = Math.round(o.x / PX) * PX, cy = Math.round(top / PX) * PX;
        ctx.fillRect(cx, cy - PX, PX, PX * 3);
        ctx.fillRect(cx - PX, cy, PX * 3, PX);
        if (big) {
          ctx.fillStyle = 'rgba(255,212,90,0.6)';
          ctx.fillRect(cx - 2 * PX, cy, PX, PX); ctx.fillRect(cx + 2 * PX, cy, PX, PX);
          ctx.fillRect(cx, cy - 2 * PX, PX, PX); ctx.fillRect(cx, cy + 2 * PX, PX, PX);
        }
      }
      if (Math.hypot(player.x - o.x, player.y - o.y) < 170) {
        const label = o.name;
        labelQueue.push(() => {
          ctx.font = '9px "DM Mono",monospace';
          ctx.textAlign = 'center';
          const tw = Math.ceil(ctx.measureText(label).width) + 12;
          const x = Math.round(o.x), y = base + 6;
          ctx.fillStyle = 'rgba(14,18,26,0.85)';
          ctx.fillRect(x - tw / 2, y, tw, 15);
          ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 1;
          ctx.strokeRect(x - tw / 2 + 0.5, y + 0.5, tw - 1, 14);
          ctx.fillStyle = '#f8f5eb';
          ctx.fillText(label, x, y + 11);
        });
      }
    }

    function weatherNow() {
      return gameMinutes < 13 * 60 ? 'storm' : gameMinutes < 16 * 60 ? 'drizzle' : 'clear';
    }

    function drawCourtyardRain(vx, vy, vw, vh, t) {
      const cy = rooms.find(r => r.outdoor);
      if (!cy) return;
      const wx = weatherNow();
      const n = wx === 'storm' ? 80 : wx === 'drizzle' ? 28 : 0;
      ctx.fillStyle = wx === 'clear' ? 'rgba(120,90,70,0.10)' : 'rgba(50,70,100,0.20)';
      ctx.fillRect(cy.x, cy.y + 110, cy.w, cy.h - 110);
      ctx.save(); ctx.beginPath(); ctx.rect(cy.x, cy.y + 110, cy.w, cy.h - 110); ctx.clip();
      ctx.fillStyle = 'rgba(170,185,210,0.07)';
      for (let k = 0; k < 5; k++) {
        const fx = cy.x + ((t * 0.012 * (1 + k * 0.4) + k * 170) % (cy.w + 260)) - 130;
        const fy = cy.y + 190 + k * 60 + Math.round(Math.sin(t / 1800 + k) * 6);
        ctx.fillRect(Math.round(fx / PX) * PX, Math.round(fy / PX) * PX, 220, 15);
      }
      ctx.restore();
      if (!n) return;
      const sec = t / 1000;
      ctx.fillStyle = 'rgba(190,212,238,0.75)';
      for (let i = 0; i < n; i++) {
        const sp = (wx === 'storm' ? 520 : 300) + (i % 5) * 40;
        const x = cy.x + ((i * 73.7 + sec * 70) % cy.w);
        const y = cy.y + 112 + ((i * 131.3 + sec * sp) % (cy.h - 112));
        ctx.fillRect(Math.round(x / PX) * PX, Math.round(y / PX) * PX, PX, PX * 3);
      }
      ctx.fillStyle = 'rgba(190,212,238,0.5)';
      for (let i = 0; i < n / 4; i++) {
        const ph = ((sec * 3 + i * 0.37) % 1);
        if (ph < 0.5) {
          const x = cy.x + ((i * 211.3) % cy.w), y = cy.y + 130 + ((i * 97.1) % (cy.h - 140));
          ctx.fillRect(Math.round(x / PX) * PX - PX, Math.round(y / PX) * PX, PX, PX);
          ctx.fillRect(Math.round(x / PX) * PX + PX, Math.round(y / PX) * PX, PX, PX);
        }
      }
    }

    function drawLighting(vx, vy, vw, vh, t) {
      const sx = Math.max(0, Math.floor(vx / PX) - 2), sy = Math.max(0, Math.floor(vy / PX) - 2);
      const sw = Math.min(AW - sx, Math.ceil(vw / PX) + 4), sh = Math.min(AH - sy, Math.ceil(vh / PX) + 4);
      const m = gameMinutes;
      let amb = m < 13 * 60 ? 0.50 : m < 16 * 60 ? 0.42 : 0.42 + Math.min(1, (m - 16 * 60) / (3 * 60)) * 0.2;
      amb *= (1 - 0.55 * flash);
      lg.globalCompositeOperation = 'source-over';
      lg.clearRect(sx, sy, sw, sh);
      lg.fillStyle = 'rgba(10,6,24,' + amb.toFixed(3) + ')';
      lg.fillRect(sx, sy, sw, sh);
      lg.globalCompositeOperation = 'destination-out';
      const lights = LIGHTS.slice();
      lights.push({ x: player.x, y: player.y - 10, r: 74, a: 1, warm: true });
      if (flash > 0.08) WINDOWS.forEach(w => lights.push({ x: w[0], y: w[1] - 20, r: 70, a: flash * 0.9, warm: false }));
      const warm = [];
      lights.forEach((L, i) => {
        const r = L.r * (1 + 0.035 * Math.sin(t / 95 + i * 1.7));
        const cx = L.x / PX, cy = L.y / PX;
        if (cx + r < sx || cx - r > sx + sw || cy + r < sy || cy - r > sy + sh) return;
        const gr = lg.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
        gr.addColorStop(0, 'rgba(0,0,0,' + L.a + ')');
        gr.addColorStop(0.55, 'rgba(0,0,0,' + (L.a * 0.55).toFixed(3) + ')');
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        lg.fillStyle = gr;
        lg.fillRect(Math.floor(cx - r), Math.floor(cy - r), Math.ceil(r * 2), Math.ceil(r * 2));
        if (L.warm) warm.push([L.x, L.y, r * PX]);
      });
      lg.globalCompositeOperation = 'source-over';
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(lightCv, sx, sy, sw, sh, sx * PX, sy * PX, sw * PX, sh * PX);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      warm.forEach(wm => {
        const gr = ctx.createRadialGradient(wm[0], wm[1], 4, wm[0], wm[1], wm[2] * 0.8);
        gr.addColorStop(0, 'rgba(255,150,60,0.16)');
        gr.addColorStop(1, 'rgba(255,150,60,0)');
        ctx.fillStyle = gr;
        ctx.fillRect(wm[0] - wm[2], wm[1] - wm[2], wm[2] * 2, wm[2] * 2);
      });
      ctx.restore();
    }

    function draw() {
      const t = performance.now();
      const cont = document.getElementById('game-container');
      const vx = Math.max(0, Math.min(W - 10, cont.scrollLeft)), vy = Math.max(0, Math.min(H - 10, cont.scrollTop));
      const vw = Math.min(W - vx, (cont.clientWidth || window.innerWidth) + 8), vh = Math.min(H - vy, (cont.clientHeight || window.innerHeight) + 8);
      if (!staticCv) buildStatic();
      ctx.imageSmoothingEnabled = false;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(staticCv, vx, vy, vw, vh, vx, vy, vw, vh);

      if (weatherNow() === 'storm' && t > nextFlash) { flash = 1; nextFlash = t + 6000 + Math.random() * 9000; }
      flash *= 0.93;
      if (flash < 0.01) flash = 0;

      SCONCES.forEach((s, i) => {
        const f = sprFlame((Math.floor(t / 140) + i) % 2);
        blit(f, s[0], s[1] - 5 * PX - 2);
      });
      if (flash > 0.02) {
        ctx.fillStyle = 'rgba(225,235,255,' + (flash * 0.85).toFixed(3) + ')';
        WINDOWS.forEach(w => {
          if (w[2] === 'stained') return;
          ctx.fillRect(w[0] - 5 * PX, w[1] - 19 * PX, 10 * PX, 15 * PX);
        });
      }

      drawWindowRain(t);
      labelQueue.length = 0;
      const items = [];
      const near = (x, y) => x > vx - 220 && x < vx + vw + 220 && y > vy - 220 && y < vy + vh + 260;
      PROPS.forEach(p => { if (near(p.x, p.y)) items.push({ y: p.sortY || p.y, f: () => drawProp(p, t) }); });
      OBJECTS.forEach(o => { if (near(o.x, o.y)) items.push({ y: o.y + 18, f: () => drawClue(o, t) }); });
      CHARACTERS.forEach(c => { if (near(c.x, c.y)) items.push({ y: c.y + 33, f: () => drawChar(c, t) }); });
      items.push({ y: player.y + 33, f: () => drawChar(player, t) });
      items.sort((a, b) => a.y - b.y).forEach(i => i.f());

      drawCourtyardRain(vx, vy, vw, vh, t);
      drawLighting(vx, vy, vw, vh, t);
      labelQueue.forEach(f => f());

      const wl = document.getElementById('weather-label');
      if (wl) {
        const wx = weatherNow();
        const txt = (wx === 'storm' ? 'STORM' : wx === 'drizzle' ? 'DRIZZLE' : 'CLEAR DUSK') + ' \u00b7 DEADLINE 7:00 PM';
        if (wl.textContent !== txt) wl.textContent = txt;
      }
    }

    return { draw: draw };
  })();

  function draw() { PIXEL.draw(); }

  function npcHome(c) {
    if (!c._home) c._home = rooms.find(r => c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h) || { none: true };
    return c._home;
  }
  function npcBlocked(c, x, y) {
    if (blocked(x, y)) return true;
    const h = npcHome(c);
    if (h.none) return false;
    const outsideNow = c.x < h.x + 50 || c.x > h.x + h.w - 50 || c.y < h.y + 125 || c.y > h.y + h.h - 45;
    if (outsideNow) return false;
    return x < h.x + 50 || x > h.x + h.w - 50 || y < h.y + 125 || y > h.y + h.h - 45;
  }

  function frame(time){
    const elapsed=Math.min((time-lastTime)/1000,.04);lastTime=time;
    if(!overlayOpen && !chatOpen) {
      gameMinutes += elapsed * GAME_MINUTES_PER_SECOND;
      if (gameMinutes - lastGossip >= 20) { lastGossip = gameMinutes; gossipTick(); }

      if (gameMinutes >= DEADLINE_MINUTES && !deadlineTriggered) {
        deadlineTriggered = true;
        showOverlay(ENDINGS.timeout.title, ENDINGS.timeout.text, [{ label: "Restart Inquiry", onClick: () => location.reload() }]);
      }

      CHARACTERS.forEach(c => {
        c.wanderTimer += elapsed;
        if (c.wanderTimer > 5) {
          c.wanderTimer = 0;
          const still = Math.random() < 0.3;
          c.vx = still ? 0 : (Math.random() - 0.5) * 0.08;
          c.vy = still ? 0 : (Math.random() - 0.5) * 0.08;
        }
        const stx = c.vx * 1500 * elapsed, sty = c.vy * 1500 * elapsed;
        let moved = false;
        if (stx) { if (!npcBlocked(c, c.x + stx, c.y)) { c.x += stx; moved = true; } else c.wanderTimer = 5.01; }
        if (sty) { if (!npcBlocked(c, c.x, c.y + sty)) { c.y += sty; moved = true; } else c.wanderTimer = 5.01; }
        c.walking = moved;
      });

      let dx=0,dy=0;
      if(keys.has('ArrowLeft')||keys.has('a'))dx--;
      if(keys.has('ArrowRight')||keys.has('d'))dx++;
      if(keys.has('ArrowUp')||keys.has('w'))dy--;
      if(keys.has('ArrowDown')||keys.has('s'))dy++;
      if(dx||dy){
        player.facing=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
        player.walking=true;
        const len=Math.hypot(dx,dy);
        movePlayer(dx/len*160*elapsed,dy/len*160*elapsed);
      } else player.walking=false;
    } else { CHARACTERS.forEach(c => c.walking = false); player.walking = false; }

    document.getElementById("clock").textContent = formatTime();

    const container = document.getElementById("game-container");
    container.scrollTop = player.y - window.innerHeight / 2;
    container.scrollLeft = player.x - window.innerWidth / 2;

    const nearChar = CHARACTERS.find(c => Math.hypot(c.x - player.x, c.y - player.y) < 60);
    const nearObj = OBJECTS.find(o => Math.hypot(o.x - player.x, o.y - player.y) < 50);

    const hintEl = document.getElementById("hint");
    if (nearChar) hintEl.textContent = "PRESS E TO TALK TO " + nearChar.shortName.toUpperCase();
    else if (nearObj) hintEl.textContent = "PRESS E TO EXAMINE " + nearObj.name.toUpperCase();
    else hintEl.textContent = "USE WASD OR ARROW KEYS TO EXPLORE THE ESTATE \u00b7 G: RUMOR MILL";

    draw();
    requestAnimationFrame(frame);
  }

  function openChat(npc) {
    chatOpen = true; currentNpc = npc;
    const fdx = player.x - npc.x, fdy = player.y - npc.y;
    npc._dir = Math.abs(fdx) > Math.abs(fdy) ? (fdx < 0 ? 'left' : 'right') : (fdy < 0 ? 'up' : 'down');
    player.facing = Math.abs(fdx) > Math.abs(fdy) ? (fdx < 0 ? 'right' : 'left') : (fdy < 0 ? 'down' : 'up');
    document.getElementById("chat-box").style.display = "block";
    document.getElementById("chat-name").textContent = npc.name + " (" + npc.role + ")";
    updateTrustUI(npc);
    const msgs = document.getElementById("messages"); msgs.innerHTML = "";
    state[npc.id].log.forEach(e => addMessageUI(e.sender, e.text));
    document.getElementById("message-input").focus();
  }

  function closeChat() {
    chatOpen = false; document.getElementById("chat-box").style.display = "none";
  }

  function updateTrustUI(npc) {
    const trust = state[npc.id].trust;
    document.getElementById("trust-fill").style.width = (trust * 10) + "%";
    document.getElementById("trust-text").textContent = "Trust " + trust + "/10";
  }

  function addMessageUI(sender, text, isThinking=false) {
    const line = document.createElement("div");
    if (isThinking) line.classList.add("thinking");
    const name = document.createElement("strong"); name.textContent = sender + ": ";
    line.appendChild(name); line.appendChild(document.createTextNode(text));
    const msgs = document.getElementById("messages");
    msgs.appendChild(line); msgs.scrollTop = msgs.scrollHeight;
    return line;
  }

  function buildPrompt(npc, st) {
    const canReveal = st.trust >= clueThreshold(npc) && !st.clueGiven;
    let prompt = `You are ${npc.name}, ${npc.role} at Blackwood Manor in 1932.\n` +
      `Current time: ${formatTime()}.\n` +
      `Personality & Background: ${npc.personality}\n` +
      `Your Secret (Keep hidden unless trust is earned): ${npc.secret}\n` +
      `Current Trust Level: ${st.trust}/10 (Threshold required to share secret: ${clueThreshold(npc)}/10).\n\n` +
      `RULES FOR YOUR RESPONSE:\n` +
      `1. Stay strictly in character for a 1932 Victorian Gothic mystery.\n` +
      `2. CONVERSATION CONTINUITY: You have ALREADY greeted the Detective with your opening line ("${npc.greeting}"). DO NOT repeat formal greetings, do NOT say "Good morning", "Good day", or "Hello, sir" again.\n` +
      `3. Respond directly and naturally to what the player just said without restarting the conversation.\n` +
      `4. Provide rich narrative context, subtle emotional cues, and detailed dialogue (aim for 2 to 3 sentences).\n`;

    const mems = st.memories.slice(-5).map(m => '- [' + m.time + '] ' + m.text).join('\n') || '- nothing notable yet';
    const rums = st.rumors.slice(-4).map(r => '- ' + r.from + ' told you: ' + r.text + ' (' + (r.believed ? 'you BELIEVE this' : 'you DOUBT this; ask the detective about it directly') + ')').join('\n') || '- none';
    const mood = st.rep >= 2 ? 'warm and more forthcoming' : st.rep <= -2 ? 'cold, wary and curt' : 'neutral';
    prompt += `\nYOUR OWN MEMORIES OF THE DETECTIVE:\n${mems}\nRUMORS YOU HEARD FROM OTHER STAFF:\n${rums}\nYour attitude toward the detective: ${mood}. Let memories and rumors colour your reply naturally; never mention scores or numbers.\n`;
    if (npc.id === 'partner') {
      prompt += `5. ANTI-CONFESSION GUARDRAIL: You are the murderer and embezzler, but you MUST NEVER confess or admit guilt under any circumstances. Deflect suspicion defensively, protect your reputation, and blame others if pressed.\n`;
    }

    if (canReveal) {
      prompt += `6. Your trust is high enough. Subtly weave this clue into your dialogue: "${npc.clue}" Set give_clue to true.\n`;
    } else {
      prompt += `6. Do NOT reveal your secret or core clue yet. Set give_clue to false.\n`;
    }

    prompt += `\nOutput ONLY valid JSON in this exact format: {"reply": "...", "trust_change": 0, "give_clue": false, "memory": "one short sentence on what the detective just said or did", "importance": 1, "valence": 0}. importance is 1-5 (4-5 only for accusations, threats, promises or revelations). valence is -1 if the detective insulted, threatened, accused or lied to you, +1 if kind, helpful or honest, else 0`;
    return prompt;
  }

  async function sendNpcMessage(npc, msg) {
    const st = state[npc.id];
    st.history.push({ role: "user", content: msg });
    try {
      const res = await fetch(GROQ_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_API_KEY },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [{ role: "system", content: buildPrompt(npc, st) }, ...st.history.slice(-MAX_HISTORY_MESSAGES)],
          temperature: 0.8, 
          max_tokens: 700,
          response_format: { type: "json_object" }
        })
      });
      const data = await res.json();
      const raw = data.choices?.[0]?.message?.content || "";
      
      let obj;
      try {
        const cleanedRaw = raw.replace(/```json/gi, "").replace(/```/g, "").trim();
        const start = cleanedRaw.indexOf("{"), end = cleanedRaw.lastIndexOf("}");
        if (start !== -1 && end !== -1 && end > start) {
          obj = JSON.parse(cleanedRaw.slice(start, end + 1));
        } else {
          throw new Error("No valid JSON boundaries found");
        }
      } catch (parseErr) {
        obj = {
          reply: raw || "I am reflecting on your words carefully, Detective.",
          trust_change: 0,
          give_clue: false,
          memory: "Detective spoke to me.",
          importance: 2,
          valence: 0
        };
      }

      st.history.push({ role: "assistant", content: JSON.stringify(obj) });
      return { 
        reply: obj.reply, 
        trustChange: Number(obj.trust_change) || 0, 
        giveClue: obj.give_clue === true, 
        memory: obj.memory, 
        importance: Number(obj.importance) || 2, 
        valence: Number(obj.valence) || 0 
      };
    } catch(e) {
      st.history.pop();
      return { reply: "I have nothing further to add right now.", trustChange: 0, giveClue: false };
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && chatOpen) { closeChat(); return; }
    if (e.target instanceof HTMLInputElement) return;
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(key)) keys.add(key);

    if (key === 'g') toggleRumorPanel();
    if (key === 'e' || key === 'E') {
      const nearChar = CHARACTERS.find(c => Math.hypot(c.x - player.x, c.y - player.y) < 60);
      const nearObj = OBJECTS.find(o => Math.hypot(o.x - player.x, o.y - player.y) < 50);
      if (overlayOpen || chatOpen) return;
      if (nearChar) { e.preventDefault(); openChat(nearChar); }
      else if (nearObj) {
        const isNew = addClue(nearObj.id, nearObj.name, nearObj.summary, nearObj.keyClue);
        showOverlay(nearObj.name, nearObj.description, [{ label: "Close", onClick: hideOverlay }]);
        if (isNew) { toast("NEW EVIDENCE DISCOVERED!"); witnessExamine(nearObj); }
      }
    }
    if (e.key === 'Escape' && chatOpen) closeChat();
  });

  document.addEventListener('keyup', e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));

  document.getElementById("chat-form").addEventListener("submit", async e => {
    e.preventDefault();
    const input = document.getElementById("message-input");
    const msg = input.value.trim();
    if (!msg || waitingForReply) return;

    const npc = currentNpc;
    const st = state[npc.id];
    state[npc.id].log.push({ sender: "You", text: msg });
    addMessageUI("You", msg);
    input.value = "";

    if (/(sorry|apolog|forgive)/i.test(msg) && st.rep < 0) { st.rep = clampRep(st.rep + 2); renderRumorPanel(); }
    if (st.rep <= -4) {
      const cold = "I have heard what is said of you, Detective. We have nothing further to discuss.";
      state[npc.id].log.push({ sender: npc.shortName, text: cold });
      addMessageUI(npc.shortName, cold);
      return;
    }
    const thinking = addMessageUI(npc.shortName, "thinking...", true);
    waitingForReply = true;
    const res = await sendNpcMessage(npc, msg);
    thinking.remove();
    waitingForReply = false;

    state[npc.id].log.push({ sender: npc.shortName, text: res.reply });
    addMessageUI(npc.shortName, res.reply);

    const gm = guessMemory(msg);
    const imp = res.importance >= 1 && res.importance <= 5 ? Math.round(res.importance) : gm.importance;
    const val = [-1, 0, 1].includes(res.valence) ? res.valence : gm.valence;
    addMemory(npc.id, (res.memory ? String(res.memory).slice(0, 140) : gm.memory), imp, val, 'direct');
    if (imp >= 4) toast(npc.shortName.toUpperCase() + " WILL REMEMBER THAT");
    st.trust = Math.max(0, Math.min(10, st.trust + res.trustChange));
    updateTrustUI(npc);

    if (res.giveClue && !st.clueGiven) {
      st.clueGiven = true;
      addClue(npc.id + "_clue", npc.shortName, npc.summary, npc.keyClue);
      toast("NEW CLUE OBTAINED FROM " + npc.shortName.toUpperCase());
    }
  });

  document.getElementById("close-chat").addEventListener("click", closeChat);

  document.getElementById("accuse-btn").addEventListener("click", () => {
    if (clues.length < MIN_CLUES_TO_ACCUSE) {
      showOverlay("Insufficient Clues", "Find at least " + MIN_CLUES_TO_ACCUSE + " total clues before making an accusation.", [{ label: "Back", onClick: hideOverlay }]);
      return;
    }
    const buttons = CHARACTERS.map(c => ({
      label: c.name,
      onClick: () => {
        const keyClueCount = clues.filter(c => c.key === true).length;
        let ending = ENDINGS.wrong;

        if (c.id === CULPRIT_ID) {
          if (keyClueCount >= TOTAL_KEY_CLUES) {
            ending = ENDINGS.perfect;
          } else if (keyClueCount >= 3) {
            ending = ENDINGS.justice;
          } else {
            ending = ENDINGS.wrong;
          }
        } else if (c.id === 'doctor') {
          ending = ENDINGS.convenient;
        } else if (c.id === 'cook') {
          ending = ENDINGS.wrongHale;
        } else {
          ending = ENDINGS.wrong;
        }

        showOverlay(ending.title, ending.text, [{ label: "Restart Inquiry", onClick: () => location.reload() }]);
      }
    }));
    buttons.push({ label: "Cancel", onClick: hideOverlay });
    showOverlay("Accuse Suspect", "Who murdered Edward Blackwood?", buttons);
  });

  const SAVE_KEY = "crimepath_save_v1";
  let gameOver = false;

  function saveGame() {
    if (gameOver) return;
    if (gameMinutes < START_MINUTES + 1 && clues.length === 0) return;
    try {
      const data = {
        savedAt: Date.now(),
        gameMinutes: gameMinutes,
        player: { x: player.x, y: player.y, facing: player.facing },
        npcPositions: CHARACTERS.map(c => ({ id: c.id, x: c.x, y: c.y })),
        state: state,
        clues: clues,
        lastNpcId: currentNpc ? currentNpc.id : null,
        chatWasOpen: chatOpen
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || typeof data.gameMinutes !== "number" || !data.state || !Array.isArray(data.clues)) return null;
      return data;
    } catch (e) {
      return null;
    }
  }

  function clearSave() {
    gameOver = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  function applySave(data) {
    gameMinutes = data.gameMinutes;

    if (data.player) {
      player.x = data.player.x;
      player.y = data.player.y;
      player.facing = data.player.facing || "down";
    }

    (data.npcPositions || []).forEach(p => {
      const c = CHARACTERS.find(ch => ch.id === p.id);
      if (c) { c.x = p.x; c.y = p.y; }
    });

    CHARACTERS.forEach(c => {
      const s = data.state[c.id];
      if (!s) return;
      state[c.id].trust = s.trust;
      state[c.id].history = s.history || [];
      state[c.id].log = s.log || state[c.id].log;
      state[c.id].clueGiven = !!s.clueGiven;
      state[c.id].rep = s.rep || 0; state[c.id].memories = s.memories || []; state[c.id].rumors = s.rumors || [];
    });

    clues = data.clues;
    updateInventoryUI();
  }

  function offerResume() {
    const data = loadSave();
    if (!data) return;

    applySave(data);

    const last = CHARACTERS.find(c => c.id === data.lastNpcId);
    const lines = [
      "Last saved: " + new Date(data.savedAt).toLocaleString(),
      "Time in the manor: " + formatTime(),
      "Evidence found: " + data.clues.length,
      last ? "Last questioned: " + last.name : "You have not questioned anyone yet."
    ];

    showOverlay("Welcome back, Detective", lines.join("\n"), [
      {
        label: "Continue investigation",
        onClick: () => {
          hideOverlay();
          toast("PROGRESS RESTORED");
          if (last && data.chatWasOpen) openChat(last);
        }
      },
      {
        label: "Start new case",
        onClick: () => { clearSave(); location.reload(); }
      }
    ]);
  }

  const originalShowOverlay = showOverlay;
  showOverlay = function (title, text, buttons) {
    if (String(title).indexOf("Ending") === 0) clearSave();
    originalShowOverlay(title, text, buttons);
  };

  setInterval(saveGame, 3000);
  window.addEventListener("beforeunload", saveGame);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); });

  offerResume();

  requestAnimationFrame(frame);
})();
</script>
